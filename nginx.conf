# ======================================================
# xxHub Nginx 配置 - 隐藏 .php 后缀
# 将以下内容加入你的 server {} 块中
# ======================================================

# 1. 核心：将无后缀的 URL 内部映射到 .php 文件
#    例如 /upload → /upload.php（浏览器地址栏保持 /upload）
location / {
    try_files $uri $uri/ $uri.php?$args;
}

# 2. PHP 文件处理（保持你原有的 PHP 配置）
location ~ \.php$ {
    # ❗ 下面是你已有的 PHP 处理，不要覆盖
    include fastcgi_params;
    # fastcgi_pass unix:/var/run/php/php7.4-fpm.sock;  # 按你实际配置
    # fastcgi_pass 127.0.0.1:9000;
    fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
}

# 3.（可选）禁止直接访问 includes 目录
location /includes/ {
    deny all;
    return 403;
}

# 4.（可选）禁止直接访问 data 目录
location /data/ {
    deny all;
    return 403;
}
